name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go mod tidy
      - run: go vet ./...

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go mod tidy
      - run: go test -v ./go/...

  solhint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solidity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: solidity/package-lock.json
      - run: npm install
      - run: npx solhint "contracts/**/*.sol"

  hardhat-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solidity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: solidity/package-lock.json
      - run: npm install
      - run: npx hardhat test
